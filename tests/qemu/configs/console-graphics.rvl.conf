# Mission 014 — graphics preview QEMU profile (PLAN / dual-gated; NEVER auto-run).
# Separate from console-interactive (serial-only, -display none, -nodefaults).
#
# Intent (executed only by run-ryoku-graphics-qemu.sh under dual auth):
#   -accel tcg -m 256 -smp 1
#   -nic none  (no disks)
#   -device virtio-vga   # virtual 2D GPU when QEMU/build supports it
#   -display gtk,gl=off  # or sdl — window + serial diag; not required 3D
#   -serial stdio -monitor none
#   serial path stays available for READY / console / hw diagnostics
#
# Honesty: profile ≠ first pixels PASS. Alpine virt may lack in-tree DRM modules.
name = console-graphics
memory_mb = 256
cpus = 1
timeout_secs = 300
accel = tcg
network = none
disk = none
kernel = run/ryoku-boot-seed-vmlinuz
initrd = run/ryoku-graphics.cpio.gz
append = console=ttyS0
iso = none
serial_log = stdio
shutdown = none
