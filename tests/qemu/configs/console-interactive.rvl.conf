# Mission 012 — interactive Ryoku Minimal QEMU profile (PREP ONLY; no guest boot here).
# Does NOT replace t3-boot-seed file-serial evidence.
#
# serial_log = stdio → guest serial on the operator terminal (not results/*.log).
# shutdown = none → required with stdio serial (no monitor+serial stdio clash).
# initrd = ryoku-minimal.cpio.gz → includes /bin/ryoku-console (interactive path).
# T3 keeps initrd = ryoku-boot-seed.cpio.gz (no console binary).
#
# Honesty: interactive session ≠ product OS login; READY/pid=1 still owned by ryoku-init.
name = console-interactive
memory_mb = 256
cpus = 1
timeout_secs = 300
accel = tcg
network = none
disk = none
kernel = run/ryoku-boot-seed-vmlinuz
initrd = run/ryoku-minimal.cpio.gz
append = console=ttyS0
iso = none
serial_log = stdio
shutdown = none
