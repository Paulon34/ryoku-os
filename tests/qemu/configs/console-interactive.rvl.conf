# Mission 011 — interactive Ryoku console QEMU profile (PREP ONLY).
# Does NOT replace t3-boot-seed file-serial evidence. No Mission 011 guest boot.
#
# serial_log = stdio → guest serial on the operator terminal (not results/*.log).
# shutdown = none → required with stdio serial (no monitor+serial stdio clash).
# network = none; lab kernel/initrd paths only; no physical disks.
#
# Honesty: interactive session ≠ product OS login; READY/pid=1 still owned by ryoku-init.
# Wire-up of ryoku-console into guest userspace is a later mission.
name = console-interactive
memory_mb = 256
cpus = 1
timeout_secs = 300
accel = tcg
network = none
disk = none
kernel = run/ryoku-boot-seed-vmlinuz
initrd = run/ryoku-boot-seed.cpio.gz
append = console=ttyS0
iso = none
serial_log = stdio
shutdown = none
