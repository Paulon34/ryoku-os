# First Boot Lab — Alpine reference ISO (Mission 005)
# Booting this guest ≠ Ryoku OS boot. Image must live under tests/qemu/run/
# (gitignored). Without the file, first-boot reports NOT_RUN / SKIPPED.
name = t2-reference-alpine
memory_mb = 512
cpus = 1
timeout_secs = 180
accel = auto
network = none
disk = none
kernel = none
iso = run/alpine-virt-3.21.9-x86_64.iso
serial_log = results/serial-t2-reference-alpine.log
boot_sentinel = login:
shutdown = monitor_quit
