# First Boot Lab — Alpine reference ISO (Missions 005–006)
# Booting this guest ≠ Ryoku OS boot. Image must live under tests/qemu/run/
# (gitignored). Without the file, first-boot reports NOT_RUN / SKIPPED.
#
# Mission 006: force TCG so CI runners without KVM still exercise a real path.
name = t2-reference-alpine
memory_mb = 512
cpus = 1
timeout_secs = 300
accel = tcg
network = none
disk = none
kernel = none
iso = run/alpine-virt-3.21.9-x86_64.iso
serial_log = results/serial-t2-reference-alpine.log
boot_sentinel = login:
# All markers must appear in serial for PASS (Alpine-specific, not harness stubs).
boot_markers = Alpine|login:
shutdown = monitor_quit
