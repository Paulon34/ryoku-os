# Boot Seed / T3 — temporary lab kernel + Ryoku initramfs (Mission 008)
# Separate from Alpine ISO T2. Booting this ≠ finished Ryoku OS product boot.
# Kernel/initrd blobs live under tests/qemu/run/ (gitignored). Without files → NOT_RUN.
#
# Real guest execution requires separate authorization (see docs/testing/boot-seed.md).
name = t3-boot-seed
memory_mb = 256
cpus = 1
timeout_secs = 120
accel = tcg
network = none
disk = none
kernel = run/ryoku-boot-seed-vmlinuz
initrd = run/ryoku-boot-seed.cpio.gz
append = console=ttyS0 earlyprintk=serial
iso = none
serial_log = results/serial-t3-boot-seed.log
boot_sentinel = RYOKU_BOOT_SEED_READY
# Both markers required on guest serial: real PID 1 identity + READY (serial-only PASS).
boot_markers = ryoku-init: pid=1|RYOKU_BOOT_SEED_READY
shutdown = monitor_quit
