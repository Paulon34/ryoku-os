# Mission 015 — shell preview QEMU profile (PLAN / dual-gated; NEVER auto-run).
# Separate from First Pixels graphics package (ryoku-graphics.cpio.gz).
name = console-shell
memory_mb = 256
cpus = 1
timeout_secs = 300
accel = tcg
network = none
disk = none
kernel = run/ryoku-boot-seed-vmlinuz
initrd = run/ryoku-shell.cpio.gz
append = console=ttyS0
iso = none
serial_log = stdio
shutdown = none
