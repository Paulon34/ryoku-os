# Ryoku OS / Zaquion Core — continuous integration (Missions 002–003)
#
# Scope: Rust fmt/build/test/clippy + Virtual Lab T0 + lightweight doc path checks.
# Out of scope: requiring KVM/QEMU, OS boots, kernel builds, ISO generation.
name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

# Least privilege: this workflow only needs repo contents.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pin matches zaquion-core/rust-toolchain.toml and the foundation host image.
  RUST_VERSION: "1.83.0"

jobs:
  rust:
    name: rust-workspace
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: zaquion-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zaquion-core -> target

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run ryoku-doctor (informational)
        # Doctor may WARN on missing QEMU/KVM on GitHub-hosted runners.
        # We do not fail the job on optional WARNs (exit 1 only for required FAIL).
        run: cargo run -p ryoku-doctor
        continue-on-error: false

      - name: Virtual Lab T0/T1/first-boot (no QEMU required)
        # T0 must PASS without virt. T1/first-boot SKIPPED/NOT_RUN must not fail the job.
        run: cargo run -p ryoku-virtlab -- all

      - name: Fetch policy mocks (no ISO download)
        # GPG fail-closed + hop-by-hop redirect allowlist — does not fetch Alpine.
        working-directory: .
        run: tests/qemu/scripts/test-fetch-policy.sh

      - name: Boot Seed prep policy mocks (no ISO/T3)
        # Dry-runs, GPG-off refuse, lab path/symlink refuses, all≠T3 — no downloads.
        working-directory: .
        run: tests/qemu/scripts/test-boot-seed-prep-policy.sh

  docs:
    name: docs-paths
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required documentation paths exist
        run: |
          set -euo pipefail
          required=(
            README.md
            README.en.md
            ROADMAP.md
            CONTRIBUTING.md
            SECURITY.md
            LICENSING.md
            docs/architecture/ADR-0001.md
            docs/architecture/ADR-0002.md
            docs/architecture/layout.md
            docs/licensing/strategy.md
            docs/testing/qemu-strategy.md
            docs/testing/virtual-lab.md
            docs/testing/reference-linux.md
            docs/testing/boot-seed.md
            docs/testing/boot-seed-t3.md
            docs/testing/console.md
            docs/testing/ryoku-minimal.md
            docs/testing/ryoku-hardware.md
            docs/testing/splash-prep-014.md
            docs/testing/ryoku-graphics.md
            docs/testing/ryoku-shell.md
            docs/testing/ryoku-shell-input.md
            docs/testing/ryoku-shell-launcher.md
            docs/testing/ryoku-shell-launcher-0152-1.md
            docs/testing/ryoku-adaptive-016.md
            docs/testing/ryoku-adaptive-0161.md
            docs/testing/ryoku-adaptive-0162.md
            docs/testing/ryoku-window-system-017.md
            docs/testing/ryoku-internal-apps-018.md
            docs/testing/ryoku-desktop-input-019.md
            docs/architecture/RYOKU_DESKTOP_ARCHITECTURE.md
            docs/performance/targets.md
            docs/publishing/first-push.md
            docs/compatibility/overview.md
            tests/qemu/README.md
            tests/qemu/configs/t1-emulator-smoke.rvl.conf
            tests/qemu/configs/t2-reference-alpine.rvl.conf
            tests/qemu/configs/t3-boot-seed.rvl.conf
            tests/qemu/configs/console-interactive.rvl.conf
            tests/qemu/fixtures/reference-image.manifest
            tests/qemu/fixtures/boot-seed-kernel.manifest
            tests/qemu/scripts/fetch-reference-image.sh
            tests/qemu/scripts/fetch-reference-image-lib.sh
            tests/qemu/scripts/test-fetch-policy.sh
            tests/qemu/scripts/build-boot-seed-initramfs.sh
            tests/qemu/scripts/build-ryoku-minimal-initramfs.sh
            tests/qemu/scripts/extract-boot-seed-kernel.sh
            tests/qemu/scripts/prep-boot-seed-artifacts.sh
            tests/qemu/scripts/test-boot-seed-prep-policy.sh
            tests/qemu/scripts/prep-console-interactive.sh
            tests/qemu/scripts/plan-minimal-guest-console-test.sh
            tests/qemu/scripts/run-ryoku-minimal-qemu.sh
            tests/qemu/scripts/prep-ryoku-minimal-artifacts.sh
            tests/qemu/scripts/test-ryoku-minimal-vm-zip.sh
            tests/qemu/scripts/test-ryoku-graphics-vm-zip.sh
            tests/qemu/scripts/run-ryoku-graphics-qemu.sh
            tests/qemu/scripts/prep-ryoku-graphics-artifacts.sh
            tests/qemu/scripts/fetch-virt-drm-modules.sh
            tests/qemu/scripts/test-virt-drm-modules-policy.sh
            tests/qemu/fixtures/virt-drm-modules.manifest
            tests/qemu/README-GRAPHICS.md
            tests/qemu/configs/console-graphics.rvl.conf
            tests/qemu/scripts/prep-ryoku-shell-artifacts.sh
            tests/qemu/scripts/run-ryoku-shell-qemu.sh
            tests/qemu/scripts/test-ryoku-shell-vm-zip.sh
            tests/qemu/README-SHELL.md
            tests/qemu/README-SHELL-INPUT.md
            tests/qemu/README-SHELL-LAUNCHER.md
            tests/qemu/README-ADAPTIVE.md
            tests/qemu/README-ADAPTIVE-PERF.md
            tests/qemu/README-CONTROLLED-PERF.md
            tests/qemu/README-WINDOW.md
            tests/qemu/README-APPS.md
            tests/qemu/README-DESKTOP-INPUT.md
            tests/qemu/configs/console-shell.rvl.conf
            zaquion-core/ryoku-shell-preview/README.md
            tests/qemu/README-VM.md
            .github/workflows/boot-seed-t3.yml
            .github/workflows/ryoku-minimal-package.yml
            zaquion-core/README.md

            zaquion-core/LICENSE-MIT
            zaquion-core/LICENSE-APACHE
            zaquion-core/ryoku-doctor/README.md
            zaquion-core/ryoku-virtlab/README.md
            zaquion-core/ryoku-init/README.md
            zaquion-core/ryoku-console/README.md
          )
          for path in "${required[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "missing required path: $path" >&2
              exit 1
            fi
            echo "ok: $path"
          done

      - name: README language pair cross-links
        run: |
          set -euo pipefail
          grep -q 'README.en.md' README.md
          grep -q 'README.md' README.en.md
