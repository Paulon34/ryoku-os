# Mission 016 / 016.1 / 016.2 — Ryoku Adaptive + Controlled Performance package.
#
# Builds musl init+console+shell-preview, packs ryoku-shell.cpio.gz
# (+ DRM + evdev/virtio_input modules). Does NOT run QEMU.
name: ryoku-shell-package

on:
  push:
    branches:
      - "cursor/ryoku-shell-015*"
      - "cursor/ryoku-shell-input-0151*"
      - "cursor/ryoku-launcher-0152*"
      - "cursor/ryoku-adaptive-016*"
      - "cursor/ryoku-perf-benchmark-0162*"
      - "cursor/ryoku-window-system-017*"
      - "cursor/ryoku-internal-apps-018*"
      - "cursor/ryoku-desktop-input-019*"
      - "cursor/ryoku-graphics-backend-020*"
  pull_request:
    branches:
      - main
      - "cursor/ryoku-adaptive-016*"
      - "cursor/ryoku-perf-benchmark-0162*"
      - "cursor/ryoku-window-system-017*"
      - "cursor/ryoku-internal-apps-018*"
      - "cursor/ryoku-desktop-input-019*"
      - "cursor/ryoku-graphics-backend-020*"
      - "cursor/ryoku-launcher-0152*"
      - "cursor/ryoku-shell-input-0151*"
      - "cursor/ryoku-shell-015*"
      - "cursor/ryoku-graphics-014*"
      - "cursor/ryoku-hardware-013*"
      - "cursor/ryoku-minimal-012"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ryoku-shell-package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.83.0"
  SOURCE_DATE_EPOCH: "1700000000"
  RYOKU_FETCH_EXECUTE: "1"
  RYOKU_VERIFY_GPG: "1"
  RYOKU_KERNEL_EXTRACT_EXECUTE: "1"
  RYOKU_SHELL_PREP_EXECUTE: "1"
  RYOKU_DRM_MODULES_EXECUTE: "1"
  RYOKU_SHELL_QEMU_EXECUTE: "0"
  RYOKU_GRAPHICS_QEMU_EXECUTE: "0"
  RYOKU_MINIMAL_QEMU_EXECUTE: "0"
  RYOKU_T3_EXECUTE: "0"

jobs:
  package:
    name: musl-shell-package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            musl-tools \
            gzip \
            xorriso \
            cpio \
            squashfs-tools

      - name: Install Rust toolchain (+ musl target)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-musl
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zaquion-core

      - name: Fetch + verify Alpine virt ISO (reference channel)
        run: |
          set -euo pipefail
          tests/qemu/scripts/fetch-reference-image.sh

      - name: Extract boot/vmlinuz-virt → ryoku-boot-seed-vmlinuz
        run: |
          set -euo pipefail
          tests/qemu/scripts/extract-boot-seed-kernel.sh
          test -f tests/qemu/run/ryoku-boot-seed-vmlinuz

      - name: Build musl + pack ryoku-shell.cpio.gz (+ DRM modules)
        run: |
          set -euo pipefail
          chmod +x tests/qemu/scripts/fetch-virt-drm-modules.sh
          chmod +x tests/qemu/scripts/prep-ryoku-shell-artifacts.sh
          tests/qemu/scripts/prep-ryoku-shell-artifacts.sh
          test -f tests/qemu/run/ryoku-shell.cpio.gz
          test -f tests/qemu/run/SHA256SUMS-shell.txt
          test -x zaquion-core/target/x86_64-unknown-linux-musl/release/ryoku-shell-preview
          gzip -dc tests/qemu/run/ryoku-shell.cpio.gz | cpio -t 2>/dev/null \
            | grep -qx './bin/ryoku-shell-preview'
          if gzip -dc tests/qemu/run/ryoku-shell.cpio.gz | cpio -t 2>/dev/null \
            | grep -q 'ryoku-graphics-demo'; then
            echo "Honesty violation: shell cpio must not contain graphics-demo"
            exit 1
          fi
          echo "shell_package_build=PASS" | tee tests/qemu/results/ryoku-shell-status.txt
          echo "GUEST_NOT_RUN=1" | tee -a tests/qemu/results/ryoku-shell-status.txt
          echo "LAUNCHER_GUEST=NOT_RUN" | tee -a tests/qemu/results/ryoku-shell-status.txt
          echo "ADAPTIVE_PROFILE=NOT_RUN" | tee -a tests/qemu/results/ryoku-shell-status.txt
          echo "ADAPTIVE_PERF=NOT_RUN" | tee -a tests/qemu/results/ryoku-shell-status.txt
          echo "PERFORMANCE_BENCHMARK=NOT_RUN" | tee -a tests/qemu/results/ryoku-shell-status.txt
          echo "CONTROLLED_BENCHMARK=NOT_RUN" | tee -a tests/qemu/results/ryoku-shell-status.txt
          echo "WINDOW_SYSTEM=NOT_RUN" | tee -a tests/qemu/results/ryoku-shell-status.txt
          echo "INPUT_FACT=NOT_RUN" | tee -a tests/qemu/results/ryoku-shell-status.txt
          echo "MOUSE_INTERACTION=NOT_RUN" | tee -a tests/qemu/results/ryoku-shell-status.txt
          echo "KEYBOARD_INTERACTION=NOT_RUN" | tee -a tests/qemu/results/ryoku-shell-status.txt
          # Cpio must include guest input modules (015.1/015.2).
          gzip -dc tests/qemu/run/ryoku-shell.cpio.gz | cpio -t 2>/dev/null \
            | grep -q 'kernel/drivers/input/evdev.ko'
          gzip -dc tests/qemu/run/ryoku-shell.cpio.gz | cpio -t 2>/dev/null \
            | grep -q 'kernel/drivers/virtio/virtio_input.ko'

      - name: Shell ZIP layout test (no QEMU)
        run: |
          set -euo pipefail
          chmod +x tests/qemu/scripts/run-ryoku-shell-qemu.sh
          chmod +x tests/qemu/scripts/test-ryoku-shell-vm-zip.sh
          tests/qemu/scripts/test-ryoku-shell-vm-zip.sh | tee tests/qemu/results/ryoku-shell-zip-test.txt

      - name: Plan/validate shell launcher (repo mode, no guest)
        run: |
          set -euo pipefail
          tests/qemu/scripts/run-ryoku-shell-qemu.sh | tee tests/qemu/results/ryoku-shell-qemu-plan.txt
          grep -q 'OK: SHA256SUMS verified' tests/qemu/results/ryoku-shell-qemu-plan.txt
          grep -q 'LAUNCHER_GUEST=NOT_RUN' tests/qemu/results/ryoku-shell-qemu-plan.txt
          grep -q 'virtio-keyboard-pci' tests/qemu/results/ryoku-shell-qemu-plan.txt
          grep -q 'virtio-tablet-pci' tests/qemu/results/ryoku-shell-qemu-plan.txt
          if grep -q 'AUTHORIZED: starting QEMU' tests/qemu/results/ryoku-shell-qemu-plan.txt; then
            echo "Honesty violation: must not start QEMU"
            exit 1
          fi

      - name: Stage downloadable shell launcher VM package
        run: |
          set -euo pipefail
          PKG=tests/qemu/results/ryoku-shell-vm-package
          rm -rf "$PKG"
          mkdir -p "$PKG/bin-musl"
          cp -a tests/qemu/run/ryoku-boot-seed-vmlinuz "$PKG/"
          cp -a tests/qemu/run/ryoku-shell.cpio.gz "$PKG/"
          cp -a tests/qemu/README-WINDOW.md "$PKG/" 2>/dev/null || true
          cp -a tests/qemu/README-APPS.md "$PKG/" 2>/dev/null || true
          cp -a tests/qemu/README-DESKTOP-INPUT.md "$PKG/" 2>/dev/null || true
          cp -a tests/qemu/README-GRAPHICS-BACKEND.md "$PKG/" 2>/dev/null || true
          cp -a tests/qemu/README-CONTROLLED-PERF.md "$PKG/"
          cp -a tests/qemu/README-ADAPTIVE-PERF.md "$PKG/"
          cp -a tests/qemu/README-ADAPTIVE.md "$PKG/"
          cp -a tests/qemu/scripts/run-ryoku-shell-qemu.sh "$PKG/"
          cp -a tests/qemu/configs/console-shell.rvl.conf "$PKG/"
          cp -a tests/qemu/fixtures/virt-drm-modules.manifest "$PKG/"
          cp -a tests/qemu/run/virt-drm-modules/PROVENANCE.txt "$PKG/DRM-MODULES-PROVENANCE.txt"
          cp -a docs/architecture/RYOKU_DESKTOP_ARCHITECTURE.md "$PKG/" 2>/dev/null || true
          cp -a docs/testing/ryoku-window-system-017.md "$PKG/" 2>/dev/null || true
          cp -a docs/testing/ryoku-internal-apps-018.md "$PKG/" 2>/dev/null || true
          cp -a docs/testing/ryoku-desktop-input-019.md "$PKG/" 2>/dev/null || true
          cp -a docs/testing/ryoku-graphics-backend-020.md "$PKG/" 2>/dev/null || true
          cp -a docs/testing/ryoku-adaptive-0162.md "$PKG/"
          cp -a docs/testing/ryoku-adaptive-0161.md "$PKG/"
          cp -a docs/testing/ryoku-adaptive-016.md "$PKG/"
          cp -a docs/testing/ryoku-shell-launcher-0152-1.md "$PKG/"
          cp -a zaquion-core/target/x86_64-unknown-linux-musl/release/ryoku-init "$PKG/bin-musl/"
          cp -a zaquion-core/target/x86_64-unknown-linux-musl/release/ryoku-console "$PKG/bin-musl/"
          cp -a zaquion-core/target/x86_64-unknown-linux-musl/release/ryoku-shell-preview "$PKG/bin-musl/"
          (
            cd "$PKG"
            sha256sum ryoku-boot-seed-vmlinuz ryoku-shell.cpio.gz \
              bin-musl/ryoku-init bin-musl/ryoku-console bin-musl/ryoku-shell-preview \
              | tee SHA256SUMS.txt
          )
          ( cd "$PKG" && RYOKU_SHELL_QEMU_EXECUTE=0 ./run-ryoku-shell-qemu.sh ) \
            | tee tests/qemu/results/ryoku-shell-staged-zip-plan.txt
          grep -q 'mode:     standalone' tests/qemu/results/ryoku-shell-staged-zip-plan.txt
          grep -q 'LAUNCHER_GUEST=NOT_RUN' tests/qemu/results/ryoku-shell-staged-zip-plan.txt
          grep -q 'CONTROLLED_BENCHMARK=NOT_RUN' tests/qemu/results/ryoku-shell-staged-zip-plan.txt

      - name: Upload Ryoku shell VM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ryoku-window-vm-${{ github.sha }}
          path: tests/qemu/results/ryoku-shell-vm-package/
          if-no-files-found: error
          retention-days: 30
