# Evaluate HM + build Ryoku-patched DMS (Quattro + Islands) against pinned Nix inputs.
# Catches malformed patches that shallow greps miss. No VM / no PASS_REAL claims.
name: ryoku-dms-nix-eval

on:
  push:
    branches:
      - cursor/**
    paths:
      - "distro/flake/**"
      - "distro/apps/ryoku-settings/**"
      - "distro/session/**"
      - "distro/tests/**"
      - ".github/workflows/ryoku-dms-eval.yml"
  pull_request:
    branches:
      - main
      - cursor/**
    paths:
      - "distro/flake/**"
      - "distro/apps/ryoku-settings/**"
      - "distro/session/**"
      - "distro/tests/**"
      - ".github/workflows/ryoku-dms-eval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-manager-eval:
    name: pure-dms-home-manager-evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Evaluate Ryoku host Home Manager activation (pure)
        run: |
          set -euo pipefail
          nix eval --raw --show-trace ./distro/flake#homeConfigurations.ryoku.activationPackage.drvPath

      - name: Evaluate ryoku-islands host Home Manager activation (pure)
        run: |
          set -euo pipefail
          nix eval --raw --show-trace ./distro/flake#homeConfigurations.ryoku-islands.activationPackage.drvPath

      - name: Check generated desktop user appears in pure Git flake
        run: |
          set -euo pipefail
          mkdir -p distro/flake/hosts/paulo
          sed -e 's/username = "ryoku"/username = "paulo"/' \
              -e 's|/home/ryoku|/home/paulo|' \
              distro/flake/hosts/ryoku/default.nix > distro/flake/hosts/paulo/default.nix
          git add -- distro/flake/hosts/paulo/default.nix
          git ls-files --error-unmatch -- distro/flake/hosts/paulo/default.nix
          nix eval --raw --show-trace ./distro/flake#homeConfigurations.paulo.activationPackage.drvPath

      - name: Check Quickshell provides the qs runtime executable
        run: |
          set -euo pipefail
          QS_DIR=$(nix build --no-link --print-out-paths ./distro/flake#quickshell)
          test -x "$QS_DIR/bin/qs"
          echo "Quickshell qs found at $QS_DIR/bin/qs"

      - name: Build Ryoku-patched DMS Quattro package
        run: |
          set -euo pipefail
          nix build --no-link --show-trace ./distro/flake#dms-shell-ryoku
          echo "PASS_BUILD: dms-shell-ryoku (quattro)"

      - name: Build Ryoku-patched DMS Islands package
        run: |
          set -euo pipefail
          nix build --no-link --show-trace ./distro/flake#dms-shell-ryoku-islands
          echo "PASS_BUILD: dms-shell-ryoku-islands"

      - name: Build ryoku-settings (unit tests + QML smoke)
        run: |
          set -euo pipefail
          # doCheck runs 72 unit tests; installCheck runs --smoke-test offscreen.
          nix build --no-link --show-trace ./distro/flake#ryoku-settings
          echo "PASS_BUILD: ryoku-settings (check + offscreen QML smoke)"

      - name: Validate HM-generated org.ryoku.Settings.desktop
        run: |
          set -euo pipefail
          ACT=$(nix build --no-link --print-out-paths ./distro/flake#homeConfigurations.ryoku.activationPackage)
          # Canonical contract: xdg.dataFile → home-files/.local/share/applications/
          desk="$ACT/home-files/.local/share/applications/org.ryoku.Settings.desktop"
          if [[ ! -e "$desk" ]]; then
            echo "FAIL: missing dataHome desktop at $desk" >&2
            ls -la "$ACT/home-files/.local/share/applications/" >&2 || true
            exit 1
          fi
          echo "found: $desk"
          grep -E '^Exec=/home/ryoku/.local/bin/ryoku-settings' "$desk"
          grep -E '^TryExec=/home/ryoku/.local/bin/ryoku-settings$' "$desk"
          grep -Fq 'Icon=org.ryoku.Settings' "$desk"
          grep -Fq 'X-Ryoku-Managed=1' "$desk"
          # Profile hiPrio override (xdg.desktopEntries) must also carry absolute Exec.
          prof="$ACT/home-path/share/applications/org.ryoku.Settings.desktop"
          test -e "$prof"
          grep -E '^Exec=/home/ryoku/.local/bin/ryoku-settings' "$prof"
          echo "PASS_BUILD: HM-generated org.ryoku.Settings.desktop (dataHome + profile)"
