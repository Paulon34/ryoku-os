# Ryoku Appearance Engine — Hyprland window border colors (Quattro).
# Generated by Matugen via DMS. Do not edit by hand.
# Active border is a 45° gradient, primary → tertiary (Omarchy Quattro's
# default border is a two-stop gradient too). surface_tint and
# tertiary_fixed_dim are standard tones, unaffected by DMS matugenContrast.
general {
    col.active_border = rgba({{colors.surface_tint.default.hex_stripped}}ee) rgba({{colors.tertiary_fixed_dim.default.hex_stripped}}ee) 45deg
    col.inactive_border = rgba({{colors.surface_variant.default.hex_stripped}}80)
}
