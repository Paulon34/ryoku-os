[workspace]
resolver = "2"
members = ["ryoku-cli", "ryoku-jarvis-bridge"]
default-members = ["ryoku-cli", "ryoku-jarvis-bridge"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Paulon34/ryoku-os"
rust-version = "1.75"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
