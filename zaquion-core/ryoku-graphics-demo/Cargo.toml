[package]
name = "ryoku-graphics-demo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Ryoku Minimal First Pixels prototype — static text on fb0 when present (Mission 014)"
readme = "README.md"
keywords = ["ryoku", "framebuffer", "graphics"]
categories = ["os"]

[dependencies]
libc = "0.2"
memmap2 = "0.9"
# Unsafe isolated in fb_mmap.rs (ioctl + explicit-length mmap). lib.rs forbids unsafe.

[lints.rust]
# main.rs / fb_mmap.rs need ioctl+mmap; lib.rs stays forbid(unsafe_code).
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }

[[bin]]
name = "ryoku-graphics-demo"
path = "src/main.rs"
