[package]
name = "ryoku-graphics-demo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Ryoku Minimal First Pixels prototype — static text on fb0 when present (Mission 014)"
readme = "README.md"
keywords = ["ryoku", "framebuffer", "graphics"]
categories = ["os"]

[dependencies]
memmap2 = "0.9"
# memmap2 encapsulates mmap; this crate stays #![forbid(unsafe_code)].

[lints.rust]
# main.rs needs one mmap via memmap2; lib.rs stays forbid(unsafe_code).
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }

[[bin]]
name = "ryoku-graphics-demo"
path = "src/main.rs"
