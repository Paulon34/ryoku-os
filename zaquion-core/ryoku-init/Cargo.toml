[package]
name = "ryoku-init"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Ryoku Boot Seed — minimal PID 1 init prototype (serial identity marker)"
readme = "README.md"
keywords = ["ryoku", "init", "boot-seed"]
categories = ["os"]

[dependencies]
# Mission 013: mount(2) for proc/sys via rustix (linux-raw; musl-static friendly).
rustix = { version = "1.1.6", features = ["mount"] }

[lints]
workspace = true

[[bin]]
name = "ryoku-init"
path = "src/main.rs"
