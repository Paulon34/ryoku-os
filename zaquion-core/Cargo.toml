[workspace]
resolver = "2"
members = ["ryoku-doctor", "ryoku-virtlab", "ryoku-init", "ryoku-console"]
default-members = ["ryoku-doctor", "ryoku-virtlab", "ryoku-init", "ryoku-console"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Paulon34/ryoku-os"
rust-version = "1.75"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }

# Boot-seed /init must not unwind out of PID 1 on panic (Mission 008.5).
[profile.release]
panic = "abort"
