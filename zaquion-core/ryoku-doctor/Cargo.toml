[package]
name = "ryoku-doctor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Read-only host diagnostics for Ryoku OS / Zaquion Core development"
readme = "README.md"
keywords = ["ryoku", "zaquion", "diagnostics"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
